# Default SPIN-Seq configuration.
# Tuned for a LOW-VRAM GPU (e.g. GTX 1650, 4 GB).

seed: 42

paths:
  raw: data/raw
  arpeggio: data/arpeggio
  labels: data/labels
  embeddings: data/embeddings_650m   # separate cache (does not overwrite the 150M one)

esm:
  # 650M reserves 3.58 GB at L=350 (fp16 + contacts) -> fits a GTX 1650 (4 GB).
  model: esm2_t33_650M_UR50D
  repr_layer: 33               # last layer of the 650M (dim 1280)
  device: cuda                 # 'cpu' if VRAM is short
  fp16: true                   # half precision to fit in 4 GB
  batch_tokens: 1024           # kept low because of VRAM
  max_len: 1022                # practical context limit of ESM-2

dataset:
  cluster_url: "https://cdn.rcsb.org/resources/sequence/clusters/clusters-by-entity-30.txt"
  cluster_file: data/clusters-by-entity-30.txt
  manifest: data/manifest.csv
  target: 300              # number of non-redundant chains to assemble
  min_len: 30
  max_len: 350             # throughput vs candidate-count trade-off
  max_resolution: 2.5      # A (X-ray only; NMR discarded)
  max_total_atoms: 8000    # drops large assemblies (Arpeggio processes everything)
  max_cif_mb: 3.0          # does not download mmCIF larger than this
  arpeggio_timeout: 60      # s; skips pathologically slow structures
  split: [0.8, 0.1, 0.1]   # train / val / test (per structure = per cluster)

train:
  neg_ratio: 5            # negatives sampled per positive
  hidden: 512
  layers: 2
  dropout: 0.2
  lr: 0.001
  weight_decay: 0.0001
  epochs: 30
  batch_chains: 8         # chains per mini-batch (lazy dataset)
  num_workers: 2          # DataLoader workers (on-the-fly features)
  batch_pairs: 4096       # (legacy) unused by the lazy dataset
  val_frac: 0.2           # (legacy) the split comes from manifest.csv
  lambda_contact: 1.0
  lambda_types: 1.0
  lambda_dist: 0.5
  use_esm_contact_feat: true   # include the ESM-2 contact score in the pair feature

# 2D convolutional head (Phase 4) - trained on w x w crops (train_conv2d.py).
conv2d:
  crop_size: 64            # w x w window per sample (VRAM: w^2 pairs/step)
  crops_per_chain: 4       # crops sampled per chain per epoch
  pos_center_prob: 0.7     # prob. of centring the crop on a positive pair (avoids empty crops)
  rare_center_prob: 0.5    # among centred ones, prob. of targeting a rare-class positive
  rare_types: [ionic, aromatic, carbonyl, hbond]  # under-represented classes
  proj_dim: 32             # projection 640->d before the outer product (main VRAM knob)
  channels: 64             # channels of the 2D ResNet
  n_blocks: 12             # dilated residual blocks
  dilations: [1, 2, 4, 8]  # cyclic dilation across the blocks
  dropout: 0.15
  lr: 0.001
  weight_decay: 0.0001
  epochs: 30
  batch_crops: 8           # crops per mini-batch
  num_workers: 2
  focal_gamma: 2.0         # (ignored when `asl` is present)
  focal_alpha: 0.25        # (ignored when `asl` is present)
  class_balanced: true     # per-class weight (inverse sqrt freq) in the focal loss - rebalances the rare ones
  class_weight_cap: 8.0    # ladder step 1: weight cap (3->8) for rare classes that were hitting the cap
  # Ladder step 2: ASL replaces the focal loss on the type channels. THE ONLY variable vs step 1.
  asl:
    gamma_pos: 0.0         # does not discount positives (focal did, via alpha=0.25)
    gamma_neg: 4.0         # discounts only the easy negatives
    clip: 0.05             # probability shifting: a negative with p < clip leaves the gradient
  cosine: true             # LR cosine annealing across epochs
  early_stop_patience: 8   # stop if the validation macro does not improve for N epochs (0 = off)
  lambda_contact: 1.0
  lambda_types: 1.0
  lambda_dist: 0.1         # distance as MSE (dist-bins regressed at the gate - abandoned)

arpeggio:
  # |i-j| < seq_sep_min is discarded (trivial neighbours).
  seq_sep_min: 3
  # Only intra-chain interactions between protein residues are considered.
  interacting_entities: INTRA_SELECTION
  drop_water: true

  # Vocabulary T (the model's target classes). Order = channel index.
  interaction_types:
    - hbond          # hydrogen bond (strong + weak)
    - polar          # polar contact (does not meet hbond geometry)
    - ionic          # ionic / salt bridge
    - aromatic       # pi-pi
    - hydrophobic    # hydrophobic
    - carbonyl       # carbonyl
    - vdw            # van der Waals (incl. vdw_clash)
    - xbond          # halogen
    - metal          # metal coordination
    - covalent       # covalent / disulfide
    - proximal       # fallback: proximity with no specific type

  # Map from Arpeggio raw types -> class in the vocabulary above.
  # Raw types observed: proximal, polar, weak_polar, hydrophobic, vdw_clash,
  # weak_hbond, hbond, vdw, carbonyl, ionic, aromatic, xbond, metal_complex,
  # clash, covalent. (to review against full-dataset statistics)
  type_map:
    hbond: hbond
    weak_hbond: hbond
    polar: polar
    weak_polar: polar
    ionic: ionic
    aromatic: aromatic
    hydrophobic: hydrophobic
    carbonyl: carbonyl
    vdw: vdw
    vdw_clash: vdw
    clash: vdw
    xbond: xbond
    metal_complex: metal
    covalent: covalent
    proximal: proximal
